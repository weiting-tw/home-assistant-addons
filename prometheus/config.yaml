---
name: "Prometheus"
description: "Prometheus 時序資料庫，抓取 exporter 指標供 Grafana 查詢"
version: "3.14.2"
slug: "prometheus"
init: false
startup: services
boot: auto

arch:
  - aarch64
  - amd64
  - armv7

url: "https://prometheus.io"

# 不走 ingress：Prometheus 的 UI 需要 --web.external-url 才能在子路徑下運作，
# 直接開埠比較單純，Grafana 也能用同一個位址當 datasource。
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: "Prometheus web UI 與 query API"

# 抓取設定放這裡，首次啟動會產生一份預設檔：
#   /addon_configs/<slug>/prometheus.yml
map:
  - addon_config:rw

options:
  retention_time: "90d"
  log_level: info
  secrets: []
schema:
  retention_time: str
  log_level: list(debug|info|warn|error)
  # 抓取目標需要的憑證。每一筆會寫成 /data/secrets/<name>（權限 600），
  # 在 prometheus.yml 用 credentials_file 引用。這樣憑證不會落在
  # /addon_configs 的明文設定檔裡，改動也不必動到那個檔。
  secrets:
    - name: str
      value: password
